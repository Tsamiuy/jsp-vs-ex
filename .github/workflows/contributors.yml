name: contributors

# Keeps the generated blocks of CONTRIBUTORS.md up to date: it reads merged pull requests and play-test issues, and
# when the blocks change it opens (or updates) one pull request from the branch contributors-update.
# Note: pull requests opened with GITHUB_TOKEN do not start other workflows, so CI does not run on that pull request.
# The change is limited to the generated blocks (tools/contributors.py --check) and is reviewed before merging.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - CONTRIBUTORS.md
  issues:
    types: [labeled, edited, closed]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  update:
    # Issue events only matter for play-test reports.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'playtest')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Credentials stay persisted here (unlike the other jobs): the job pushes the branch contributors-update with
      # the checkout token. Nothing else in the job runs code from outside the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 tools/test_contributors.py

      - name: Fetch and generate
        run: |
          python3 tools/contributors.py --fetch --data "$RUNNER_TEMP/contributors.json"
          python3 tools/contributors.py --data "$RUNNER_TEMP/contributors.json"
          python3 tools/contributors.py --check

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- CONTRIBUTORS.md; then
            echo "CONTRIBUTORS.md is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C contributors-update
          git add CONTRIBUTORS.md
          git commit -m "CONTRIBUTORS.md: update the generated activity and play testers"
          git push --force origin contributors-update
          body="Generated by the contributors workflow from merged pull requests and play-test reports (tools/contributors.py). Only the text between the markers changes."
          if [ -n "$(gh pr list --head contributors-update --state open --json number --jq '.[].number')" ]; then
            gh pr edit contributors-update --body "$body"
          else
            gh pr create --base main --head contributors-update \
              --title "CONTRIBUTORS.md: update the generated activity and play testers" --body "$body"
          fi
