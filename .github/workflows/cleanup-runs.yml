name: cleanup-runs

# One-time cleanup, to be removed again right after use: deletes the old workflow runs (and with them their logs
# and artifacts) of this repository, except the run that is doing the deleting.
# Run by hand (Actions > cleanup-runs > Run workflow). "dry_run" is on by default and only counts the runs; set it
# to false to delete. Runs that are still going cannot be deleted and are skipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count the runs, do not delete (set to false to delete)"
        type: boolean
        default: true

permissions:
  actions: write

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -u
          ids=$(gh api --paginate "repos/${REPO}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')
          total=0
          deleted=0
          failed=0
          for id in $ids; do
            if [ "$id" = "$CURRENT_RUN" ]; then continue; fi
            total=$((total + 1))
            if [ "$DRY_RUN" = "true" ]; then continue; fi
            if gh api -X DELETE "repos/${REPO}/actions/runs/${id}" > /dev/null; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done
          echo "Finished runs found: ${total}; deleted: ${deleted}; failed: ${failed}; dry run: ${DRY_RUN}"
          if [ "$failed" -gt 0 ]; then exit 1; fi
