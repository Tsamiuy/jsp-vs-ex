name: release-notify

# Posts one message to the project's Discord channel when a release is published (pre-releases too).
# The release workflow only creates a draft; publishing it is done by a person, so this trigger runs then.
# The webhook URL lives only in the repository secret DISCORD_RELEASE_WEBHOOK; without it (forks) the job does nothing.

on:
  release:
    types: [published]

permissions: {}

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_RELEASE_WEBHOOK is not set; no message sent."
            exit 0
          fi
          kind="release"
          [ "$PRERELEASE" = "true" ] && kind="pre-release"
          # allowed_mentions empty: the message can never ping anyone, whatever the release title says.
          jq -n --arg tag "$TAG" --arg url "$URL" --arg kind "$kind" '{
            username: "J-Stars Victory VS-EX",
            allowed_mentions: {parse: []},
            embeds: [{
              title: ("J-Stars Victory VS-EX " + $tag + " is out"),
              url: $url,
              description: ("A new " + $kind + " is available. Download it and read the changes on the release page."),
              color: 15105570
            }]
          }' > payload.json
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" --data @payload.json "$WEBHOOK"
          echo "Posted $TAG ($kind)."
