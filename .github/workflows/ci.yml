name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tells the slow jobs below whether this pull request needs them. A pull request that only changes the plain text
  # files listed in TEXT_ONLY (no README, NOTICE.md or docs/ folder: the site build and tests read them) skips them; a
  # skipped job counts as passed. Pushes to main and any other change run everything, and so does a failed or missing
  # answer from this job (the slow jobs test `!= 'false'`, with !cancelled() so a failed `changes` does not skip them).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Does this change need the slow jobs?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TEXT_ONLY: CHANGELOG.md CONTRIBUTING.md AGENTS.md KNOWN_ISSUES.md CONTRIBUTORS.md SECURITY.md
        run: |
          heavy=true
          if [ "$EVENT" = pull_request ]; then
            heavy=false; n=0
            while IFS= read -r -d '' f; do
              n=$((n+1)); echo "changed: $f"
              text=false
              for t in $TEXT_ONLY; do [ "$f" = "$t" ] && text=true; done
              $text || heavy=true
            done < <(git diff -z --name-only "$BASE...$HEAD")
            [ "$n" -gt 0 ] || heavy=true
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "slow jobs needed: $heavy"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository checks (files, wording, Python syntax)
        if: github.event_name != 'pull_request'
        run: python3 tools/ci/repo_checks.py

      - name: Repository checks and commit identities
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/repo_checks.py --commits "$BASE..$HEAD"

      - name: Features page matches docs/features.tsv and ROADMAP.md (generator)
        run: python3 tools/features.py --check

      - name: Version numbers agree (tools/release.py)
        run: python3 tools/release.py --check

      - name: Shell scripts parse
        # .gitattributes keeps *.sh stored and checked out with LF.
        run: |
          bad=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "$f: syntax error"; bad=1; }
          done
          exit $bad

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Output "${f}:$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

  launcher:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the launcher with the C# compiler that ships with Windows
        # Same flags as launcher/build_launcher19.bat and firstrun.py; the exe goes to the runner's temp folder.
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          $out = Join-Path $env:RUNNER_TEMP 'launcher-build'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $csc /nologo /target:winexe /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:$out\J-Stars Launcher.exe" launcher\JStarsLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$out\J-Stars Launcher.exe")) { exit 1 }

  # The host tests (no game data, no GPU) are listed once in tools/ci/host-tests.txt and run by tools/ci/run_host_tests.py:
  # one named result per test. A test file in git that is neither listed nor excluded there fails the coverage step.
  host-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same pinned font as installer.yml (the overlay font test draws the glyph atlas from it); never committed or shipped.
      FIRA_URL: https://raw.githubusercontent.com/bBoxType/FiraSans/f54eeb3124c63fe9b5bcd36d09d1cd46788cd15e/Fira_Sans_4_3/Fonts/Fira_Sans_TTF_4301/Normal/Italic/FiraSans-HeavyItalic.ttf
      FIRA_SHA256: a30804a11e8ad1b38d6cabc725644a1048aab6fb7e2811507f0e208a469c8ef9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      # The .deb files of the Mono and SDL2 packages are kept in the Actions cache, so a run whose cache restores
      # installs them without the package mirror (a slow or failing mirror used 16 to 18 minutes of this job's 20 on
      # three runs, and failed the first runs of #211, #212 and #217 and main's run on #218). The key is the image name,
      # the package list and the image version. Several image versions are in use at once, so a run without a cache for
      # its own version restores the newest one for the same image name and package list. Restored files are used only
      # if their checksums match, none of their packages is already on the image (so nothing is downgraded or half
      # installed) and `dpkg -i` installs every package; anything else goes to the mirror. A run that did not restore
      # its own version's key saves the files it installed under that key, unless a failed cache install left the mirror
      # only part of the set. No permission is added: the cache actions use the runner's own cache token. Caches saved
      # on main are read by every branch and pull request; one saved on a pull request is read only by that pull
      # request.
      - name: Package cache key
        id: debkey
        env:
          DEB_PACKAGES: mono-mcs mono-runtime libsdl2-dev
        run: |
          list=$(printf '%s\n' $DEB_PACKAGES | sort | sha256sum | cut -c1-16)
          echo "prefix=debs-${ImageOS:-unknown}-$list-" >> "$GITHUB_OUTPUT"
          echo "key=debs-${ImageOS:-unknown}-$list-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "packages=$DEB_PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Package cache (restore)
        id: debcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debkey.outputs.key }}
          restore-keys: ${{ steps.debkey.outputs.prefix }}

      # From the mirror, apt gives up on a request after 30 s without data (3 retries), a failed index update is an
      # error instead of leaving stale lists, the whole apt part is tried a second time (-f repairs packages a failed
      # cache install left half-installed), and the step has a limit of its own: a mirror problem fails it by name.
      - name: Host test dependencies (Pillow, numpy, Mono and SDL2)
        id: debs
        timeout-minutes: 8
        env:
          DEBS: ${{ runner.temp }}/debs
          PACKAGES: ${{ steps.debkey.outputs.packages }}
          EXACT_HIT: ${{ steps.debcache.outputs.cache-hit }}
        run: |
          python3 -m pip install --disable-pip-version-check pillow==12.3.0 numpy==2.5.3
          # The cache fits this image when every cached package is one the image does not have yet (the cache holds
          # only what apt added) and every exact-version dependency on a package the image has names the version it
          # has (a -dev package needs the same version of its library, which a newer image may have updated).
          fits() {
            (cd "$DEBS" && sha256sum -c --quiet SHA256SUMS) || return 1
            for f in "$DEBS"/*.deb; do
              p=$(dpkg-deb -f "$f" Package) || return 1
              if [ "$(dpkg-query -W -f='${db:Status-Status}' "$p" 2>/dev/null)" = installed ]; then
                echo "$p is already installed on this image"; return 1
              fi
              while read -r dep ver; do
                have=$(dpkg-query -W -f='${Version}' "$dep" 2>/dev/null) || continue
                if [ -n "$have" ] && ! dpkg --compare-versions "$have" eq "$ver"; then
                  echo "$p needs $dep $ver, this image has $have"; return 1
                fi
              done < <(dpkg-deb -f "$f" Depends Pre-Depends | sed 's/^[A-Za-z-]*: //' | tr ',|' '\n\n' |
                       sed -n 's/^ *\([^ :(]*\)\(:[a-z0-9]*\)\{0,1\} *(= *\([^)]*\)).*/\1 \3/p')
            done
          }
          # A requested name can be a virtual package (on ubuntu-26.04 mono-mcs is provided by mono-devel), so it is
          # present when an installed package has that name or provides it.
          present() {
            dpkg-query -W -f='${db:Status-Status} ${Package}, ${Provides}\n' 2>/dev/null | awk -v n="$1" '
              $1 == "installed" { sub(/^installed /, ""); gsub(/ *\([^)]*\)/, ""); k = split($0, a, / *, */)
                                  for (i = 1; i <= k; i++) { sub(/:.*/, "", a[i]); if (a[i] == n) f = 1 } }
              END { exit !f }'
          }
          all_present() { for p in $PACKAGES; do present "$p" || { echo "$p is not installed"; return 1; }; done; }
          tried=false
          if compgen -G "$DEBS/*.deb" >/dev/null; then
            if fits; then
              tried=true
              if sudo dpkg -i --refuse-downgrade "$DEBS"/*.deb && all_present; then
                echo "installed from the package cache"
                [ "$EXACT_HIT" = true ] || echo "save=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "::warning::package cache not usable, using the mirror"
          fi
          rm -rf "$DEBS"; mkdir -p "$DEBS/partial"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::Archives=$DEBS"
          for try in 1 2; do
            if sudo apt-get $APT -o APT::Update::Error-Mode=any update -qq &&
               sudo apt-get $APT install -f -y --no-install-recommends $PACKAGES; then
              sudo rm -rf "$DEBS/partial" "$DEBS/lock"; sudo chown -R "$(id -u)" "$DEBS"
              # Nothing downloaded: nothing to keep. After a failed cache install apt fetched only what was missing,
              # so the set is incomplete and is not saved.
              if compgen -G "$DEBS/*.deb" >/dev/null && [ "$EXACT_HIT" != true ] && [ "$tried" = false ]; then
                (cd "$DEBS" && sha256sum ./*.deb > SHA256SUMS)
                echo "save=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "::warning::package mirror problem (attempt $try of 2)"
          done
          exit 1

      - name: Package cache (save)
        if: steps.debs.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debkey.outputs.key }}

      - name: Fira Sans file (pinned download)
        run: |
          mkdir -p build/installer/fonts
          curl -sSfL -o build/installer/fonts/FiraSans-HeavyItalic.ttf "$FIRA_URL"
          echo "$FIRA_SHA256  build/installer/fonts/FiraSans-HeavyItalic.ttf" | sha256sum -c -

      - name: Patched ps3recomp folder (for the tests that read the toolkit headers)
        run: python3 installer/tools/export_toolkit.py --out "$RUNNER_TEMP/ps3recomp"

      - name: Every test file is listed or excluded in tools/ci/host-tests.txt
        run: python3 tools/ci/run_host_tests.py --check-coverage

      - name: Host tests (one result per test; a self-skipping test fails)
        run: python3 tools/ci/run_host_tests.py --strict-skip --toolkit "$RUNNER_TEMP/ps3recomp" --scratch "$RUNNER_TEMP/host-tests"

  # The patch series are what every player's build depends on: a hunk that no longer applies would only show up when a
  # release is built. Same tool as the installer build (export_toolkit.py: git archive of the pin, git apply only).
  patches:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: The patch series applies to a scratch copy of the pinned ps3recomp
        # installer/port/patches on v0.19.0 (the earlier v0.15 series is gone: tag legacy-v15)
        run: python3 tools/ci/check_patch_series.py --scratch "$RUNNER_TEMP/series"

      - name: The patch series applies with core.autocrlf true (Git for Windows' default)
        # Some pinned upstream files have CR-LF lines that the patches carry byte for byte; the export must not let a user's
        # autocrlf setting rewrite them. Same pinned checkout as the step above.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "true"
        run: python3 tools/ci/check_patch_series.py --scratch "$RUNNER_TEMP/series-autocrlf"

  # The host tests that need Windows (the launcher's settings order, the generated build script and path quoting) plus the
  # Python tests whose path and quoting handling differs there, run as the installer build runs them: core.autocrlf false
  # and a python3 on PATH.
  host-tests-windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: python3 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: llvm-mingw from toolchain.json (pinned, SHA-256 checked)
        run: python installer/tools/fetch_toolchain.py --only llvm-mingw

      - name: Launcher and the stand-in game exe the tests start
        run: |
          cc=build/installer/toolchain-cache/trees/llvm-mingw/bin/x86_64-w64-mingw32-clang.exe
          mkdir -p "$RUNNER_TEMP/exes"
          "$cc" -O2 -mwindows -s -o "$RUNNER_TEMP/exes/jsp-launcher.exe" installer/launcher/launcher.c
          "$cc" -O2 -municode -o "$RUNNER_TEMP/exes/fake_tool.exe" installer/tools/fake_tool.c   # wmain entry point

      - name: Patched ps3recomp folder (audio_lock_test builds the toolkit's own Windows test from it)
        run: python installer/tools/export_toolkit.py --out "$RUNNER_TEMP/ps3recomp"

      - name: Host tests on Windows (one result per test)
        run: |
          export MINGW_CC="$PWD/build/installer/toolchain-cache/trees/llvm-mingw/bin/x86_64-w64-mingw32-clang.exe"
          python tools/ci/run_host_tests.py --strict-skip --toolkit "$RUNNER_TEMP/ps3recomp" --launcher "$RUNNER_TEMP/exes/jsp-launcher.exe" --fake-tool "$RUNNER_TEMP/exes/fake_tool.exe" --scratch "$RUNNER_TEMP/host-tests"

  # The port's own sources against the patched toolkit, with the compiler the installer bundles. Syntax only: the lifted game code
  # and the runtime library link are made on the player's PC from their EBOOT, so a full build and link are not possible here.
  port-compile:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: llvm-mingw from toolchain.json (pinned, SHA-256 checked)
        run: python installer/tools/fetch_toolchain.py --only llvm-mingw

      - name: Patched ps3recomp folder
        run: python installer/tools/export_toolkit.py --out "$RUNNER_TEMP/ps3recomp"

      - name: Port sources and boot scaffold compile (syntax only, stand-in ppu_recomp.h)
        run: |
          bin="$PWD/build/installer/toolchain-cache/trees/llvm-mingw/bin"
          python tools/ci/port_syntax_check.py --toolkit "$RUNNER_TEMP/ps3recomp" --cxx "$bin/x86_64-w64-mingw32-clang++.exe" --cc "$bin/x86_64-w64-mingw32-clang.exe"
