name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository checks (files, wording, Python syntax)
        if: github.event_name != 'pull_request'
        run: python3 tools/ci/repo_checks.py

      - name: Repository checks and commit identities
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/repo_checks.py --commits "$BASE..$HEAD"

      - name: Features page matches docs/features.tsv and ROADMAP.md (generator)
        run: python3 tools/features.py --check

      - name: Version numbers agree (tools/release.py)
        run: python3 tools/release.py --check

      - name: Shell scripts parse
        # .gitattributes keeps *.sh stored and checked out with LF.
        run: |
          bad=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "$f: syntax error"; bad=1; }
          done
          exit $bad

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Output "${f}:$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the launcher with the C# compiler that ships with Windows
        # Same flags as launcher/build_launcher.bat; the exe goes to the runner's temp folder.
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          $out = Join-Path $env:RUNNER_TEMP 'launcher-build'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $csc /nologo /target:winexe /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:$out\J-Stars Launcher.exe" launcher\JStarsLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$out\J-Stars Launcher.exe")) { exit 1 }

  # The host tests (no game data, no GPU) are listed once in tools/ci/host-tests.txt and run by tools/ci/run_host_tests.py:
  # one named result per test. A test file in git that is neither listed nor excluded there fails the coverage step.
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same pinned font as installer.yml (the overlay font test draws the glyph atlas from it); never committed or shipped.
      FIRA_URL: https://raw.githubusercontent.com/bBoxType/FiraSans/f54eeb3124c63fe9b5bcd36d09d1cd46788cd15e/Fira_Sans_4_3/Fonts/Fira_Sans_TTF_4301/Normal/Italic/FiraSans-HeavyItalic.ttf
      FIRA_SHA256: a30804a11e8ad1b38d6cabc725644a1048aab6fb7e2811507f0e208a469c8ef9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Pillow and numpy (as installer.yml pins them), Mono compiler for the launcher's LAN test
        run: |
          python3 -m pip install --disable-pip-version-check pillow==12.3.0 numpy==2.5.3
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime

      - name: Fira Sans file (pinned download)
        run: |
          mkdir -p build/installer/fonts
          curl -sSfL -o build/installer/fonts/FiraSans-HeavyItalic.ttf "$FIRA_URL"
          echo "$FIRA_SHA256  build/installer/fonts/FiraSans-HeavyItalic.ttf" | sha256sum -c -

      - name: Patched ps3recomp folder (for the tests that read the toolkit headers)
        run: python3 installer/tools/export_toolkit.py --out "$RUNNER_TEMP/ps3recomp"

      - name: Every test file is listed or excluded in tools/ci/host-tests.txt
        run: python3 tools/ci/run_host_tests.py --check-coverage

      - name: Host tests (one result per test; a self-skipping test fails)
        run: python3 tools/ci/run_host_tests.py --strict-skip --toolkit "$RUNNER_TEMP/ps3recomp" --scratch "$RUNNER_TEMP/host-tests"

  # The patch series are what every player's build depends on: a hunk that no longer applies would only show up when a
  # release is built. Same tool as the installer build (export_toolkit.py: git archive of the pin, git apply only).
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: The patch series applies to a scratch copy of the pinned ps3recomp
        # installer/port/patches on v0.19.0 (the legacy series, installer/patches, is no longer checked: tag legacy-v15)
        run: python3 tools/ci/check_patch_series.py --scratch "$RUNNER_TEMP/series"

  # The host tests that need Windows (the launcher's settings order, the generated build script and path quoting) plus the
  # Python tests whose path and quoting handling differs there, run as the installer build runs them: core.autocrlf false
  # and a python3 on PATH.
  host-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: python3 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: llvm-mingw from toolchain.json (pinned, SHA-256 checked)
        run: python installer/tools/fetch_toolchain.py --only llvm-mingw

      - name: Launcher and the stand-in game exe the tests start
        run: |
          cc=build/installer/toolchain-cache/trees/llvm-mingw/bin/x86_64-w64-mingw32-clang.exe
          mkdir -p "$RUNNER_TEMP/exes"
          "$cc" -O2 -mwindows -s -o "$RUNNER_TEMP/exes/jsp-launcher.exe" installer/launcher/launcher.c
          "$cc" -O2 -municode -o "$RUNNER_TEMP/exes/fake_tool.exe" installer/tools/fake_tool.c   # wmain entry point

      - name: Host tests on Windows (one result per test)
        run: python tools/ci/run_host_tests.py --strict-skip --launcher "$RUNNER_TEMP/exes/jsp-launcher.exe" --fake-tool "$RUNNER_TEMP/exes/fake_tool.exe" --scratch "$RUNNER_TEMP/host-tests"

  # The port's own sources against the patched toolkit, with the compiler the installer bundles. Syntax only: the lifted game code
  # and the runtime library link are made on the player's PC from their EBOOT, so a full build and link are not possible here.
  port-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: llvm-mingw from toolchain.json (pinned, SHA-256 checked)
        run: python installer/tools/fetch_toolchain.py --only llvm-mingw

      - name: Patched ps3recomp folder
        run: python installer/tools/export_toolkit.py --out "$RUNNER_TEMP/ps3recomp"

      - name: Port sources and boot scaffold compile (syntax only, stand-in ppu_recomp.h)
        run: |
          bin="$PWD/build/installer/toolchain-cache/trees/llvm-mingw/bin"
          python tools/ci/port_syntax_check.py --toolkit "$RUNNER_TEMP/ps3recomp" --cxx "$bin/x86_64-w64-mingw32-clang++.exe" --cc "$bin/x86_64-w64-mingw32-clang.exe"
